name: Publish

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "094954420758"

jobs:
  build:
    if: github.run_number != 1
    name: CDP-build-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build and Publish
        uses: DEFRA/cdp-build-action/build@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version-file: '.java-version'
          cache: 'maven'
      - run: mvn clean verify

  # Adds linux/arm64 to the Docker Hub tags the build job has just published.
  # Runs after it, never gates it, and never touches ECR.
  publish-arm64:
    needs: build
    uses: DEFRA/trade-imports-workspace/.github/workflows/publish-multiarch.yml@main
    with:
      image-name: trade-imports-animals-backend

  sonarcloud:
    name: SonarCloud Scan
    needs: build
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/sonarcloud.yml
    secrets: inherit
