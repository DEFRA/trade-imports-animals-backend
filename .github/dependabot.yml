version: 2

updates:
  - package-ecosystem: maven
    directory: /
    open-pull-requests-limit: 10

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

    allow:
      - dependency-type: direct

    # springdoc-openapi 3 needs Spring Boot 4. Held until this service
    # moves to Boot 4.
    ignore:
      - dependency-name: 'org.springdoc:springdoc-openapi*'
        versions: ['>= 3']

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'