# Generated by `tim deps dependabot trade-imports-animals-backend --write` from
# config/dependency-sets.json in the trade-imports workspace. Change that
# file and regenerate. A hand edit here fails `--check`.
version: 2

updates:
  # Update Maven packages
  - package-ecosystem: maven
    directory: /
    open-pull-requests-limit: 10

    # One rolling PR for every patch and minor bump. Majors match no group, so
    # Dependabot raises each one on its own.
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - 'patch'
          - 'minor'
        patterns:
          - '*'

    # A held package stays at its current version: Dependabot does not propose
    # the versions it breaks, security fixes among them.
    ignore:
      # held: org.springdoc:springdoc-openapi-starter-webmvc-ui, since 2026-11-27
      # springdoc-openapi 3 needs Spring Boot 4, and the Java services run
      # Spring Boot 3.5. Hold it until EUDPA-852 moves them to Spring Boot 4.
      # Failing test: E2E Tests and SonarCloud Scan on Dependabot's
      # springdoc-openapi 3.2.1 pull request
      # Lift it with tim deps lift when a newer
      # org.springdoc:springdoc-openapi-starter-webmvc-ui or
      # org.springframework.boot:spring-boot-starter-parent clears it.
      # https://github.com/DEFRA/trade-imports-animals-backend/pull/144
      - dependency-name: 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
        versions:
          - '[3.0.0,4.0.0)'

    # Check for updates on this schedule, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

    allow:
      # Include direct pom.xml updates
      - dependency-type: direct

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # Same policy as Maven: one rolling PR for patch and minor bumps, majors
    # raised one at a time. Action majors change inputs or runtime, so they
    # are the ones worth reading.
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - 'patch'
          - 'minor'
        patterns:
          - '*'

    # Check for updates on this schedule, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'
